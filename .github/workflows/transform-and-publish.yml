name: Transform & Publish

on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Which book to transform (psalms, song-of-solomon, lamentations, prayers, or all)'
        required: false
        default: 'all'
      start_chapter:
        description: 'Start chapter number (range filter for numbered chapters)'
        required: false
        default: '1'
      end_chapter:
        description: 'End chapter number'
        required: false
        default: '150'
      model:
        description: 'AI model to use (e.g. oc/hy3-free)'
        required: false
        default: 'oc/hy3-free'
      regenerate_site:
        description: 'Rebuild the GitHub Pages site (docs/) after transforming?'
        required: false
        default: 'true'

  schedule:
    # Run daily at 6am UTC — transforms missing chapters, prayers & songs, then rebuilds the site
    - cron: '0 6 * * *'

permissions:
  contents: write

# Serialize runs so concurrent dispatches don't reject each other's pushes to main.
concurrency:
  group: transform-and-publish
  cancel-in-progress: false

jobs:
  transform-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout songs lyrics repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Download SGSS Bible repo
        run: |
          mkdir -p /tmp/sgss-bible
          curl -sL "https://github.com/Walusimbi-Leon1/sgss-bible/archive/refs/heads/main.tar.gz" | tar xz -C /tmp/sgss-bible --strip-components=1
          ls /tmp/sgss-bible/sgss/

      - name: Split books into chapters
        run: |
          python3 << 'SPLIT_EOF'
          import os, re

          BOOKS = {
              "psalms":      ("/tmp/sgss-bible/sgss/19-Psalms.txt",        "psalms",       "Psalm"),
              "songofsolomon": ("/tmp/sgss-bible/sgss/22-SongOfSolomon.txt", "solomon",     "Song of Solomon"),
              "laments":     ("/tmp/sgss-bible/sgss/25-Lamentations.txt",  "laments",      "Lamentations"),
          }

          chapter_pattern = re.compile(r"^Chapter\s+(\d+)\s*$", re.MULTILINE)

          for key, (input_file, out_dir, title_prefix) in BOOKS.items():
              if not os.path.exists(input_file):
                  print(f"SKIP {key}: {input_file} not found")
                  continue
              os.makedirs(out_dir, exist_ok=True)
              with open(input_file, "r", encoding="utf-8") as f:
                  content = f.read()
              lines = content.split("\n")
              if lines and re.match(r"^(The Book of|The )", lines[0].strip()):
                  lines = lines[1:]
              content = "\n".join(lines)
              matches = list(chapter_pattern.finditer(content))
              chapters = []
              for i, m in enumerate(matches):
                  num = int(m.group(1))
                  start = m.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(content)
                  chapters.append((num, content[start:end].strip()))
              chapters.sort(key=lambda x: x[0])
              for num, text in chapters:
                  base_name = {"psalms": "Psalm", "songofsolomon": "SongOfSolomon",
                               "laments": "Lamentation"}[key]
                  filename = os.path.join(out_dir, f"{base_name}_{num:03d}.txt")
                  with open(filename, "w", encoding="utf-8") as f:
                      f.write(f"{title_prefix} {num}\n\n{text}\n")
                  print(f"Created {filename}")
              print(f"{key}: {len(chapters)} chapters\n")
          SPLIT_EOF

      - name: Extract special passages (prayers, songs)
        run: |
          mkdir -p prayers lamentations
          cp scripts/extract_special.py /tmp/extract_special.py
          python3 /tmp/extract_special.py --bible /tmp/sgss-bible/sgss

      - name: Transform chapters to simple English
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          BOOK="${{ inputs.book }}"
          START=${{ inputs.start_chapter }}
          END=${{ inputs.end_chapter }}
          FAILED=0

          shopt -s nullglob
          FILES=()
          OUT=()
          add_files() {  # <base_dir> <glob_pattern> <out_category_dir>
            local bd="$1" pat="$2" od="$3"
            for f in $bd/$pat; do
              [ -e "$f" ] || continue
              FILES+=("$f")
              local b=$(basename "$f" .txt)
              OUT+=("$od/${b}_simple.txt")
            done
          }
          if [ "$BOOK" = "psalms" ] || [ "$BOOK" = "all" ]; then
            add_files psalms "Psalm_*.txt" "songs"
          fi
          if [ "$BOOK" = "song-of-solomon" ] || [ "$BOOK" = "songofsolomon" ] || [ "$BOOK" = "all" ]; then
            add_files solomon "SongOfSolomon_*.txt" "songs"
          fi
          if [ "$BOOK" = "laments" ] || [ "$BOOK" = "all" ]; then
            add_files lamentations "Lamentation_*.txt" "laments"
          fi
          if [ "$BOOK" = "prayers" ] || [ "$BOOK" = "all" ]; then
            add_files prayers "*.txt" "prayers"
            add_files songs "song-of-the-sea-*.txt" "songs"
            add_files songs "song-of-moses-*.txt" "songs"
            add_files songs "hannah-song-*.txt" "songs"
            add_files songs "deborah-song-*.txt" "songs"
            add_files songs "habakkuk-song-*.txt" "songs"
            add_files songs "jonah-song-*.txt" "songs"
            add_files songs "new-song-*.txt" "songs"
          fi

          mkdir -p songs prayers lamentations

          for i in "${!FILES[@]}"; do
            file="${FILES[$i]}"
            output_file="${OUT[$i]}"
            base=$(basename "$file" .txt)
            chapter_num=$(echo "$base" | grep -oP '(?<=_)\d+')
            if [ -n "$chapter_num" ]; then
              chapter_num=$((10#$chapter_num))
              if [ "$chapter_num" -lt "$START" ] || [ "$chapter_num" -gt "$END" ]; then
                continue
              fi
            fi
            src_verses=$(grep -cE '^[0-9]+ ' "$file" 2>/dev/null || echo 0)
            threshold=3
            if [ "$src_verses" -lt 3 ]; then threshold=$src_verses; fi
            if [ -f "$output_file" ] && [ -s "$output_file" ]; then
              existing_verses=$(grep -cE '^[0-9]+ ' "$output_file" || true)
              if [ "$existing_verses" -ge "$threshold" ]; then
                echo "Skipping $base - already transformed ($existing_verses verses)"
                continue
              else
                echo "$base is a stub (<$threshold verses) - re-transforming"
              fi
            fi
            echo "=== Transforming $base ==="
            ok=0
            for attempt in 1 2 3; do
              python3 transform_psalms.py "$file" --output "$output_file" || {
                echo "Transform attempt $attempt failed for $base"; sleep 5; continue
              }
              vcount=$(grep -cE '^[0-9]+ ' "$output_file" 2>/dev/null || echo 0)
              if [ "$vcount" -ge "$threshold" ]; then
                ok=1; break
              else
                echo "Attempt $attempt produced only $vcount verses for $base - retrying"
                sleep 8
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "AI transform failed for $base after retries - using rule-based fallback"
              python3 scripts/rule_simplify.py "$file" --output "$output_file"
              fcount=$(grep -cE '^[0-9]+ ' "$output_file" 2>/dev/null || echo 0)
              if [ "$fcount" -ge "$threshold" ]; then ok=1; fi
            fi
            if [ "$ok" -ne 1 ]; then
              echo "Failed to transform $base entirely"; FAILED=$((FAILED+1)); continue
            fi
            git add "$output_file"
            git commit -m "Transform $base to simple English" || {
              echo "Failed to commit $base (likely no change / concurrent) - continuing"; \
            }
            git pull --rebase origin ${{ github.ref_name }} 2>&1 || true
            git push origin HEAD:${{ github.ref_name }} 2>&1 || {
              git pull --rebase origin ${{ github.ref_name }} 2>&1 || true
              git push origin HEAD:${{ github.ref_name }} 2>&1
            }
            echo "Pushed $base"
          done
          echo "=== Summary ==="
          echo "Failed chapters: $FAILED"

      - name: Generate index + Pages site
        if: inputs.regenerate_site == 'true'
        run: |
          python3 scripts/generate_site.py --songs-dir songs --output-dir docs
          git add docs INDEX.md
          git commit -m "Rebuild site: refresh index and Pages HTML" || true
          git push origin HEAD:${{ github.ref_name }} 2>&1 || true

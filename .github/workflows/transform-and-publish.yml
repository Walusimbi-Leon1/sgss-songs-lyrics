name: Transform & Publish

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'Start from which Psalm chapter (1-150)'
        required: false
        default: '1'
      end_chapter:
        description: 'End at which Psalm chapter (1-150)'
        required: false
        default: '150'
      model:
        description: 'AI model to use (e.g. oc/hy3-free)'
        required: false
        default: 'oc/hy3-free'
      regenerate_site:
        description: 'Rebuild the GitHub Pages site (docs/) after transforming?'
        required: false
        default: 'true'

  schedule:
    # Run daily at 6am UTC — transforms any missing Psalms, then rebuilds the site
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  transform-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout songs lyrics repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Configure git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Download Psalms from SGSS Bible repo
        run: |
          mkdir -p /tmp/sgss-bible
          curl -sL "https://github.com/Walusimbi-Leon1/sgss-bible/archive/refs/heads/main.tar.gz" | tar xz -C /tmp/sgss-bible --strip-components=1
          ls /tmp/sgss-bible/sgss/

      - name: Split Psalms into chapters
        run: |
          python3 << 'SPLIT_EOF'
          import os, re
          input_file = "/tmp/sgss-bible/sgss/19-Psalms.txt"
          output_dir = "psalms"
          os.makedirs(output_dir, exist_ok=True)
          with open(input_file, "r", encoding="utf-8") as f:
              content = f.read()
          lines = content.split("\n")
          if lines and lines[0].strip() == "The Book of Psalms":
              lines = lines[1:]
          content = "\n".join(lines)
          chapter_pattern = re.compile(r"^Chapter\s+(\d+)\s*$", re.MULTILINE)
          matches = list(chapter_pattern.finditer(content))
          chapters = []
          for i, match in enumerate(matches):
              chapter_num = match.group(1)
              start = match.end()
              end = matches[i + 1].start() if i + 1 < len(matches) else len(content)
              chapter_text = content[start:end].strip()
              chapters.append((int(chapter_num), chapter_text))
          chapters.sort(key=lambda x: x[0])
          for chapter_num, chapter_text in chapters:
              filename = os.path.join(output_dir, f"Psalm_{chapter_num:03d}.txt")
              with open(filename, "w", encoding="utf-8") as f:
                  f.write(f"Psalm {chapter_num}\n\n")
                  f.write(chapter_text)
                  f.write("\n")
              print(f"Created {filename}")
          print(f"\nTotal chapters: {len(chapters)}")
          SPLIT_EOF

      - name: Transform chapters to simple English
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: |
          START=${{ inputs.start_chapter }}
          END=${{ inputs.end_chapter }}
          mkdir -p songs
          FAILED=0
          for file in psalms/Psalm_*.txt; do
            chapter_num=$(echo "$file" | grep -oP 'Psalm_\K\d+')
            chapter_num=$((10#$chapter_num))
            if [ "$chapter_num" -lt "$START" ] || [ "$chapter_num" -gt "$END" ]; then
              continue
            fi
            base=$(basename "$file" .txt)
            output_file="songs/${base}_simple.txt"
            if [ -f "$output_file" ] && [ -s "$output_file" ]; then
              echo "Skipping chapter $chapter_num - already transformed"
              continue
            fi
            echo "=== Transforming Psalm $chapter_num ==="
            python3 transform_psalms.py "$file" --output "$output_file" || {
              echo "Failed to transform Psalm $chapter_num"
              FAILED=$((FAILED + 1))
              continue
            }
            git add "$output_file"
            git commit -m "Transform Psalm $chapter_num to simple English" || {
              echo "Failed to commit Psalm $chapter_num"
              FAILED=$((FAILED + 1))
              continue
            }
            git push origin HEAD:${{ github.ref_name }} 2>&1
            echo "Pushed Psalm $chapter_num"
          done
          echo "=== Summary ==="
          echo "Failed chapters: $FAILED"

      - name: Generate index + Pages site
        if: inputs.regenerate_site == 'true'
        run: |
          python3 scripts/generate_site.py --songs-dir songs --output-dir docs
          git add docs INDEX.md
          git commit -m "Rebuild site: refresh index and Pages HTML" || true
          git push origin HEAD:${{ github.ref_name }} 2>&1 || true
